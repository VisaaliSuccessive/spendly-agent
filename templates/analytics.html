{% extends "base.html" %}
{% block title %}Analytics — Spendly{% endblock %}

{% block head %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/analytics.css') }}">
{% endblock %}

{% block content %}
<div class="analytics-page">
  <h1 class="analytics-heading">Analytics</h1>

  <section class="analytics-section">
    <h2 class="analytics-section-title">Monthly Spending Trend</h2>
    <div class="trend-chart">
      {% for month in trend %}
      <div class="trend-bar-col">
        <div class="trend-bar-track">
          <div class="trend-bar" style="height: {{ month.percent }}%"></div>
        </div>
        <span class="trend-amount">₹{{ month.total }}</span>
        <span class="trend-label">{{ month.label }}</span>
      </div>
      {% endfor %}
    </div>
  </section>
</div>
{% endblock %}
